# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.
# У mako НЕТ секции [default]: глобальные опции идут до первого [criteria],
# поэтому генерируем весь конфиг целиком, без include.

font=JetBrainsMono Nerd Font Bold 11
background-color={{colors.surface_container.default.hex}}cc
text-color={{colors.on_surface.default.hex}}
border-color={{colors.primary.default.hex}}
border-size=2
border-radius=16
padding=14,18
margin=0
outer-margin=16
default-timeout=5000
layer=overlay
anchor=top-right

[urgency=high]
background-color={{colors.error_container.default.hex}}ee
text-color={{colors.on_error_container.default.hex}}
border-color={{colors.error.default.hex}}
default-timeout=0
