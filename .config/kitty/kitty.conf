# ╔══════════════════════════════════════════════════════════════╗
# ║          KITTY CONFIG — Material You · Midnight Lake         ║
# ║   Palette extracted from wallpaper (pixel art night scene)   ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Font ────────────────────────────────────────────────────────
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic

font_size           11.5

disable_ligatures   never
adjust_line_height  105%
adjust_column_width 0

# ── Window ──────────────────────────────────────────────────────
window_padding_width        10
window_border_width         1px
active_border_color         #c084fc
inactive_border_color       #3d3556

background_opacity          0.8
dynamic_background_opacity  yes
background_blur             32

# Titlebar — плотный, не прозрачный (тёмно-фиолетовый)
wayland_titlebar_color      #1e1a2e

# ── Cursor ──────────────────────────────────────────────────────
cursor                  #c084fc
cursor_text_color       #13111a
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_stop_blinking_after 10.0

# ── Scrollback ──────────────────────────────────────────────────
scrollback_lines        10000

# ── Mouse ───────────────────────────────────────────────────────
mouse_hide_wait         3.0
url_color               #818cf8
url_style               curly
open_url_with           default
detect_urls             yes
copy_on_select          no
strip_trailing_spaces   smart

# ── Bell ────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       #9b4fcc
window_alert_on_bell    yes

# ── Tab bar — скрыта полностью ───────────────────────────────────
# Часики — от Powerlevel10k в правой части промпта
tab_bar_style           hidden

# ── Colors — Material You · Midnight Lake ───────────────────────
background              #13111a
foreground              #e6dff5

selection_foreground    #13111a
selection_background    #c084fc

# Black — тёмные поверхности
color0  #1e1a2e
color8  #3d3556

# Red — мягкий малиновый
color1  #cf6679
color9  #f08090

# Green — бирюзово-зелёный (отражение деревьев)
color2  #78b5a0
color10 #a0d4c0

# Yellow — янтарный фонарь
color3  #e8a87c
color11 #f0c898

# Blue — индиго воды
color4  #6b7fd4
color12 #8899f0

# Magenta — лавандовый пурпур неба
color5  #b87de0
color13 #d4a0f0

# Cyan — звёздный голубой
color6  #7eb8d4
color14 #a8d8f0

# White — мягкий звёздный свет
color7  #c8c0d8
color15 #f0ecf8

# ── Advanced ────────────────────────────────────────────────────
term                xterm-kitty
sync_to_monitor     yes
repaint_delay       8
input_delay         3
paste_actions       quote-urls-at-prompt

# ── Shell integration ────────────────────────────────────────────
shell_integration   no-title

# ── Keyboard shortcuts ──────────────────────────────────────────
kitty_mod ctrl+shift

map kitty_mod+t         new_tab_with_cwd
map kitty_mod+w         close_tab
map kitty_mod+right     next_tab
map kitty_mod+left      previous_tab
map kitty_mod+1         goto_tab 1
map kitty_mod+2         goto_tab 2
map kitty_mod+3         goto_tab 3
map kitty_mod+4         goto_tab 4
map kitty_mod+5         goto_tab 5

map kitty_mod+d         launch --location=vsplit --cwd=current
map kitty_mod+shift+d   launch --location=hsplit --cwd=current
map kitty_mod+h         neighboring_window left
map kitty_mod+l         neighboring_window right
map kitty_mod+k         neighboring_window up
map kitty_mod+j         neighboring_window down

map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard

map kitty_mod+up        scroll_line_up
map kitty_mod+down      scroll_line_down
map kitty_mod+page_up   scroll_page_up
map kitty_mod+page_down scroll_page_down

map kitty_mod+f2        edit_config_file
map kitty_mod+f5        load_config_file
