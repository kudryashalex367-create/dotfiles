
# ╔══════════════════════════════════════════════════════════════╗
# ║          KITTY CONFIG — Monochrome Obsidian & Zinc           ║
# ║             Minimalist High-Contrast Grayscale               ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Font Settings ───────────────────────────────────────────────
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic

font_size           11.5
disable_ligatures   never
adjust_line_height  105%
adjust_column_width 0

# ── Window Styling ──────────────────────────────────────────────
window_padding_width        12
window_border_width         1px
active_border_color         #ffffff
inactive_border_color       #27272a

background_opacity          0.88
dynamic_background_opacity  yes
background_blur             32

# Titlebar — Глубокий темный (для интеграции с Wayland/GNOME)
wayland_titlebar_color      #09090b

# ── Cursor ──────────────────────────────────────────────────────
cursor                  #ffffff
cursor_text_color       #09090b
cursor_shape            beam
cursor_beam_thickness   1.8
cursor_blink_interval   0.5
cursor_stop_blinking_after 10.0

# ── Scrollback & Mouse ──────────────────────────────────────────
scrollback_lines        10000
mouse_hide_wait         3.0
url_color               #ffffff
url_style               straight
open_url_with           default
detect_urls             yes
copy_on_select          no
strip_trailing_spaces   smart

# ── Bell ────────────────────────────────────────────────────────
enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       #3f3f46
window_alert_on_bell    yes

# ── Tab Bar (Hidden - Status managed by Waybar) ─────────────────
tab_bar_style           hidden

# ── Monochrome Color Palette ────────────────────────────────────
background              #09090b
foreground              #e4e4e7

selection_foreground    #09090b
selection_background    #e4e4e7

# Black / Dark Surfaces
color0  #18181b
color8  #3f3f46

# Red -> Slate Silver (Warning / Highlight)
color1  #a1a1aa
color9  #f4f4f5

# Green -> Soft Gray (Success / Git added)
color2  #71717a
color10 #d4d4d8

# Yellow -> Medium Gray (Variables / Git modified)
color3  #8e8e93
color11 #e4e4e7

# Blue -> Cool Gray (Links / Directories)
color4  #a1a1aa
color12 #ffffff

# Magenta -> Muted Violet-Gray (Keywords)
color5  #71717a
color13 #d4d4d8

# Cyan -> Bright Platinum (Constants)
color6  #a1a1aa
color14 #ffffff

# White -> Pure White Shades
color7  #d4d4d8
color15 #ffffff

# ── Advanced & Performance ──────────────────────────────────────
term                xterm-kitty
sync_to_monitor     yes
repaint_delay       8
input_delay         3
paste_actions       quote-urls-at-prompt
shell_integration   no-title

# ── Hotkeys ─────────────────────────────────────────────────────
kitty_mod ctrl+shift

map kitty_mod+t         new_tab_with_cwd
map kitty_mod+w         close_tab
map kitty_mod+right     next_tab
map kitty_mod+left      previous_tab

map kitty_mod+d         launch --location=vsplit --cwd=current
map kitty_mod+shift+d   launch --location=hsplit --cwd=current
map kitty_mod+h         neighboring_window left
map kitty_mod+l         neighboring_window right
map kitty_mod+k         neighboring_window up
map kitty_mod+j         neighboring_window down

map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard

map kitty_mod+f2        edit_config_file
map kitty_mod+f5        load_config_file
# Fix Enter key bug in Nano and other applications
map enter send_text all \x0d
map shift+enter send_text all \x0d
