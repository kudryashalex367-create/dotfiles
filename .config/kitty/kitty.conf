# Font Settings
font_family         JetBrainsMono Nerd Font
bold_font           JetBrainsMono Nerd Font Bold
italic_font         JetBrainsMono Nerd Font Italic
bold_italic_font    JetBrainsMono Nerd Font Bold Italic
font_size           11.5
disable_ligatures   never
adjust_line_height  105%
adjust_column_width 0

# Альтернативные глифы JetBrains Mono (более «живой» вид)
font_features JetBrainsMonoNF +ss01 +ss02 +cv01

# Window Styling
window_padding_width        12
window_border_width         2px
active_border_color         #a78bfa
inactive_border_color       #2a2140
background_opacity          0.8
dynamic_background_opacity  yes
background_blur             0
wayland_titlebar_color      #0b0912

# Не запоминать размер окна между запусками.
# Иначе kitty при старте шлёт композитору хинт максимайза,
# который Hyprland 0.56.2+ ошибочно трактует как fullscreen.
remember_window_size        no
initial_window_width        640
initial_window_height       400

# Cursor
cursor                  #c4b5fd
cursor_text_color       #0b0912
cursor_shape            beam
cursor_beam_thickness   1.8

# Плавное дыхание курсора вместо резкого мигания
cursor_blink_interval   0.5 ease-in-out
cursor_stop_blinking_after 10.0

# Аппаратный шлейф и размытие курсора в движении (Motion Blur)
cursor_trail                 1
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 1

# Scrollback & Mouse
scrollback_lines        10000
mouse_hide_wait         3.0
url_color               #c4b5fd
url_style               straight
open_url_with           default
detect_urls             yes
copy_on_select          no
strip_trailing_spaces   smart

# Bell & Tabs
enable_audio_bell       no
visual_bell_duration    0.1
visual_bell_color       #4a4063
window_alert_on_bell    yes

# Таб-бар в стиле powerline (монохромная палитра)
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_background   #201a30
active_tab_foreground   #ffffff
inactive_tab_background #0b0912
inactive_tab_foreground #8b82a3

# Color Palette (Obsidian Violet)
background              #0b0912
foreground              #e6e1f0
selection_foreground    #ffffff
selection_background    #3b2f63

color0  #1b1626
color8  #4a4063
color1  #f38ba8
color9  #f7a8bf
color2  #a6e3a1
color10 #bdeeb8
color3  #f9e2af
color11 #fcecc7
color4  #8aa4f8
color12 #aebcfb
color5  #a78bfa
color13 #c4b5fd
color6  #94e2d5
color14 #b3efe4
color7  #cdc6e0
color15 #f3effa

# Advanced Performance
term                xterm-kitty
sync_to_monitor     yes
repaint_delay       8
input_delay         3
paste_actions       quote-urls-at-prompt
shell_integration   no-title

# Keybindings
kitty_mod ctrl+shift

map kitty_mod+t         new_tab_with_cwd
map kitty_mod+w         close_tab
map kitty_mod+right     next_tab
map kitty_mod+left      previous_tab

map kitty_mod+d         launch --location=vsplit --cwd=current
map kitty_mod+shift+d   launch --location=hsplit --cwd=current
map kitty_mod+h         neighboring_window left
map kitty_mod+l         neighboring_window right
map kitty_mod+k         neighboring_window up
map kitty_mod+j         neighboring_window down

map kitty_mod+equal     change_font_size all +1.0
map kitty_mod+minus     change_font_size all -1.0
map kitty_mod+0         change_font_size all 0

map kitty_mod+c         copy_to_clipboard
map kitty_mod+v         paste_from_clipboard
map kitty_mod+f2        edit_config_file
map kitty_mod+f5        load_config_file
