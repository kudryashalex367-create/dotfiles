# Автоблокировка Hyprland: hypridle управляет DPMS и запуском hyprlock.
# ПК: suspend не используется — только гашение экрана и блокировка сессии.
# Таймауты: 150 с → DPMS off, 300 с → hyprlock.

general {
    # pidof-страховка: второй экземпляр hyprlock не запускаем
    lock_cmd         = pidof hyprlock || hyprlock
    # Страховка на случай suspend/гибернации в будущем
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch dpms on
}

# 2.5 мин бездействия — гасим монитор; ввод вернёт его через on-resume
listener {
    timeout    = 150
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# 5 мин — блокируем сессию (hyprlock поднимается через general.lock_cmd)
listener {
    timeout    = 300
    on-timeout = loginctl lock-session
}
