source = ~/.config/hypr/colors.conf


background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(11, 9, 18, 0.85)
    noise = 0.02
    contrast = 1.1
    brightness = 0.75
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# ── 1. ВЕРХНИЙ ЭТАЖ ЧАСОВ (Часы) ─────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 0.95)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 210
    halign = center
    valign = center
}

# ── 2. НИЖНИЙ ЭТАЖ ЧАСОВ (Минуты) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(167, 139, 250, 0.9)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 60
    halign = center
    valign = center
}

# ── 3. ДАТА (День недели и число) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(201, 194, 224, 0.9)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -45
    halign = center
    valign = center
}

# ── 4. ПОЛЕ ВВОДА ПАРОЛЯ ─────────────────────────────────────────
input-field {
    monitor =
    size = 300, 52
    rounding = 16
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(167, 139, 250)
    inner_color = rgb(21, 17, 31)
    font_color = rgb(255, 255, 255)
    check_color = rgb(196, 181, 253)
    fail_color = rgb(248, 113, 113)

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(11, 9, 18, 0.2)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false

    position = 0, -90
    halign = center
    valign = center
}

# ── 5. ИНДИКАТОР РАСКЛАДКИ КЛАВИАТУРЫ ────────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = rgba(139, 130, 163, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}
