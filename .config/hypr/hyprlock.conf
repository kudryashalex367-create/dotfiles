# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(16130ad9)
    noise = 0.02
    contrast = 1.1
    brightness = 0.75
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

# ── 0. АВАТАР ────────────────────────────────────────────────────
image {
    monitor =
    path = /home/zev1ce/.config/hypr/assets/avatar.png
    size = 180
    rounding = 90
    border_size = 2
    border_color = rgba(ffe45be6)
    position = 0, 400
    halign = center
    valign = center
}

# ── 1. ВЕРХНИЙ ЭТАЖ ЧАСОВ (Часы) ─────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(e9e2d1f2)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 210
    halign = center
    valign = center
}

# ── 2. НИЖНИЙ ЭТАЖ ЧАСОВ (Минуты) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(ffe45be6)
    font_size = 150
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 44
    halign = center
    valign = center
}

# ── 3. ДАТА (День недели и число) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(e9e2d1f2)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(16130a66)
    position = 0, -61
    halign = center
    valign = center
}

# ── 4. ПОЛЕ ВВОДА ПАРОЛЯ ─────────────────────────────────────────
input-field {
    monitor =
    size = 300, 52
    rounding = 16
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1

    outer_color = rgb(ffe45b)
    inner_color = rgb(222015)
    font_color = rgb(e9e2d1)
    check_color = rgb(c8e8ff)
    fail_color = rgb(ffb4ab)

    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(16130a33)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    hide_input = false

    position = 0, -123
    halign = center
    valign = center
}

# ── 5. ИНДИКАТОР РАСКЛАДКИ КЛАВИАТУРЫ ────────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = rgba(cec6add9)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(16130a66)
    position = 0, -183
    halign = center
    valign = center
}

# ── 6. ПЛЕЕР (Сейчас играет) ─────────────────────────────────────
# Метка молчит, если playerctl не установлен или нет активного плеера.
label {
    monitor =
    text = cmd[update:1000] ~/.local/bin/nowplaying
    color = rgba(e9e2d1eb)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(16130a66)
    position = 0, -228
    halign = center
    valign = center
}
