source = ~/.config/hypr/colors.conf


background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(9, 9, 11, 0.85)
    noise = 0.015
}

# ── 1. ВЕРХНИЙ ЭТАЖ ЧАСОВ (Часы) ─────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}

# ── 2. НИЖНИЙ ЭТАЖ ЧАСОВ (Минуты) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = rgba(228, 228, 231, 0.75)
    font_size = 120
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 70
    halign = center
    valign = center
}

# ── 3. ДАТА (День недели и число) ────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d %B")"
    color = rgba(161, 161, 170, 0.85)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -5
    halign = center
    valign = center
}

# ── 4. ПОЛЕ ВВОДА ПАРОЛЯ ─────────────────────────────────────────
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true
    
    outer_color = rgb(39, 39, 42)
    inner_color = rgb(18, 18, 21)
    font_color = rgb(255, 255, 255)
    check_color = rgb(161, 161, 170)
    fail_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, -90
    halign = center
    valign = center
}

# ── 5. ИНДИКАТОР РАСКЛАДКИ КЛАВИАТУРЫ ────────────────────────────
label {
    monitor =
    text = $LAYOUT
    color = rgba(161, 161, 170, 0.6)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}
