# ╔══════════════════════════════════════════════════════════════╗
# ║            HYPRLOCK CONFIG — Obsidian Monochrome             ║
# ╚══════════════════════════════════════════════════════════════╝

background {
    monitor =
    color = rgba(9, 9, 11, 1.0)
    # Если хотите размывать текущие обои вместо черного фона — расскоментируйте строку ниже:
    # path = screenshot
    blur_passes = 3
    blur_size = 8
}

# ── Часы ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(255, 255, 255, 1.0)
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# ── Дата ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B %Y')"
    color = rgba(161, 161, 170, 1.0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

# ── Поле ввода пароля ───────────────────────────────────────────
input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    
    outer_color = rgb(39, 39, 42)
    inner_color = rgb(18, 18, 21)
    font_color = rgb(255, 255, 255)
    check_color = rgb(161, 161, 170)
    fail_color = rgb(255, 255, 255)

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false

    position = 0, -80
    halign = center
    valign = center
}
