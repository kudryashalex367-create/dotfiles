[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Adwaita
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.3
line-height=22
anchor=center
layer=overlay
match-counter=yes
show-actions=yes

[border]
width=2
radius=16
selection-radius=10

[colors]
background=0b0912cc
text=e6e1f0ff
prompt=a78bfaff
input=ffffffff
match=c4b5fdff
selection=201a30ff
selection-text=ffffffff
selection-match=c4b5fdff
border=a78bfaff
