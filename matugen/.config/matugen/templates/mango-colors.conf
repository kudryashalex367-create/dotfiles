# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.
# Формат Mango: 0xRRGGBBAA. Подключается через source_optional
# в ~/.config/mango/config.conf.
root_color=0x{{colors.surface.default.hex_stripped}}ff
border_color=0x{{colors.surface_variant.default.hex_stripped}}ff
focus_color=0x{{colors.primary.default.hex_stripped}}ff
urgent_color=0x{{colors.error.default.hex_stripped}}ff
