# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

background            {{colors.background.default.hex}}
# on_background в тёмной M3 всегда ~белый — текст не «перекрашивается».
# primary_fixed_dim = tone ~80: светлый, но с заметным тоном обоев.
foreground            {{colors.primary_fixed_dim.default.hex}}
cursor                {{colors.primary.default.hex}}
cursor_text_color     {{colors.on_primary.default.hex}}
selection_background  {{colors.primary_container.default.hex}}
selection_foreground  {{colors.on_primary_container.default.hex}}
url_color             {{colors.primary.default.hex}}
visual_bell_color     {{colors.surface_variant.default.hex}}

# ANSI 16: нужен для fastfetch, ls, git и т.п. У M3 нет отдельной
# зелёной/жёлтой ветки, поэтому green=primary, yellow=tertiary,
# blue=secondary, magenta=primary_fixed_dim, cyan=tertiary_fixed_dim —
# оттенки смещены, но все 16 реагируют на обои.
color0  {{colors.surface_variant.default.hex}}
color8  {{colors.outline.default.hex}}
color1  {{colors.error.default.hex}}
color9  {{colors.error.default.hex}}
color2  {{colors.primary.default.hex}}
color10 {{colors.primary.default.hex}}
color3  {{colors.tertiary.default.hex}}
color11 {{colors.tertiary.default.hex}}
color4  {{colors.secondary.default.hex}}
color12 {{colors.secondary.default.hex}}
color5  {{colors.primary_fixed_dim.default.hex}}
color13 {{colors.primary_fixed_dim.default.hex}}
color6  {{colors.tertiary_fixed_dim.default.hex}}
color14 {{colors.tertiary_fixed_dim.default.hex}}
color7  {{colors.on_surface_variant.default.hex}}
color15 {{colors.on_surface.default.hex}}

active_tab_background   {{colors.surface_container_high.default.hex}}
active_tab_foreground   {{colors.on_surface.default.hex}}
inactive_tab_background {{colors.surface.default.hex}}
inactive_tab_foreground {{colors.on_surface_variant.default.hex}}
