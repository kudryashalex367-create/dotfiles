# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Adwaita
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.3
line-height=22
anchor=center
layer=overlay
match-counter=yes
show-actions=yes

[border]
width=2
radius=16
selection-radius=10

[colors]
background={{colors.surface.default.hex_stripped}}cc
text={{colors.on_surface.default.hex_stripped}}ff
prompt={{colors.primary.default.hex_stripped}}ff
input={{colors.on_surface.default.hex_stripped}}ff
match={{colors.secondary.default.hex_stripped}}ff
selection={{colors.primary_container.default.hex_stripped}}ff
selection-text={{colors.on_primary_container.default.hex_stripped}}ff
selection-match={{colors.secondary.default.hex_stripped}}ff
border={{colors.primary.default.hex_stripped}}ff
