# Mango (mangowm) — вторая сессия рядом с Hyprland.
# Ключи и синтаксис: https://mangowm.github.io/docs (0.18.5 / git).
# Проверка без запуска: mango -c ~/.config/mango/config.conf -p
# Перезагрузка: mmsg dispatch reload_config

# ---------------------
# ---- ENVIRONMENT ----
# ---------------------
# env сбрасывается при каждом reload — держим всё здесь.
env=XCURSOR_THEME,Bibata-Modern-Ice
env=XCURSOR_SIZE,24
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=MOZ_ENABLE_WAYLAND,1
env=GDK_BACKEND,wayland,x11
env=QT_QPA_PLATFORM,wayland;xcb
env=QT_QPA_PLATFORMTHEME,qt6ct
env=_JAVA_AWT_WM_NONREPARENTING,1
env=LIBVA_DRIVER_NAME,radeonsi

# -------------------
# ---- AUTOSTART ----
# -------------------
# Скрипт запускается один раз при старте сессии (не при reload).
exec_once=bash ~/.config/mango/autostart.sh

# ------------------
# ---- MONITORS ----
# ------------------
# DP-2, 1920x1080@144. Каскад 144→120→60 у Mango не поддерживается:
# если режима не будет, монитор получит preferred.
monitor_rule=name:^DP-2$,width:1920,height:1080,refresh:144,x:0,y:0,scale:1,vrr:0

# -------------------
# ---- WALL COLORS ---
# -------------------
# Fallback — Obsidian Violet. Реальная палитра в colors.conf (matugen),
# подключается ниже и перекрывает значения.
root_color=0x0b0912ff
border_color=0x2a2140ff
focus_color=0xa78bfaff
urgent_color=0xffb4abff
source_optional=~/.config/mango/colors.conf

# ------------------
# ---- LOOK & FEEL ---
# ------------------
border_px=2
border_radius=16
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=10
gap_outer_vertical=10
focused_opacity=1.0
unfocused_opacity=0.975

# Затемнение неактивных окон (dim_strength 0.055 ≈ 0x0e)
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x0000000e

# Тени: как range=12/render_power=2 в Hyprland
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=10
shadows_blur=15
shadows_position_x=0
shadows_position_y=0
shadows_color=0x000000cc

# Блюр слоёв пока выключен: имена layer surface нужно сверять
# через `mmsg get last_open_surface`, иначе размоется весь стол.
blur=0
blur_layer=0

# -------------------
# ---- ANIMATIONS ----
# -------------------
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.5
zoom_initial_ratio=0.4
zoom_end_ratio=0.8

animation_duration_open=400
animation_duration_close=350
animation_duration_move=500
animation_duration_tag=300

# niriEaseOut (0.16,1 0.3,1), popIn (0.05,0.9 0.1,1.05), smoothFade
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.16,1.0,0.3,1.0
animation_curve_move=0.16,1.0,0.3,1.0
animation_curve_tag=0.16,1.0,0.3,1.0

tag_animation_direction=1

# ----------------
# ---- LAYOUT ----
# ----------------
tag_num=9
# В Hyprland был dwindle; делаем его дефолтом для всех тегов.
tag_rule=id:1,no_hide:1,layout_name:dwindle
tag_rule=id:2,no_hide:1,layout_name:dwindle
tag_rule=id:3,no_hide:1,layout_name:dwindle
tag_rule=id:4,no_hide:1,layout_name:dwindle
tag_rule=id:5,no_hide:1,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle

# ---------------
# ---- INPUT ----
# ---------------
xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle
repeat_rate=40
repeat_delay=300

# Hyprland follow_mouse=1 — ближайший аналог sloppy_focus
sloppy_focus=1
focus_on_activate=1

# Hyprland sensitivity=-0.4
mouse_accel_profile=2
mouse_accel_speed=-0.4

cursor_theme=Bibata-Modern-Ice
cursor_size=24
cursor_hide_on_keypress=1

# Tearing как в Hyprland: глобально разрешён, рвут только окна с force_tearing
allow_tearing=1

# -----------------
# ---- BINDINGS ----
# -----------------
# Программы
bind=SUPER,RETURN,spawn,kitty
bind=SUPER,D,spawn,fuzzel
bind=SUPER,E,spawn,nautilus
bind=SUPER,Q,killclient
bind=SUPER,N,spawn,makoctl restore
bind=SUPER+SHIFT,N,spawn,makoctl dismiss -a
bind=SUPER+SHIFT,V,spawn_shell,cliphist list | fuzzel --dmenu | cliphist decode | wl-copy
bind=SUPER+SHIFT,Q,quit
bind=SUPER,L,spawn_shell,pidof hyprlock >/dev/null || hyprlock
bind=SUPER,V,togglefloating
bind=SUPER,code:61,spawn_shell,$HOME/.local/bin/keybinds
bind=SUPER,A,spawn_shell,$HOME/.local/bin/wall-random
bind=SUPER,W,spawn_shell,$HOME/.local/bin/wall-picker
bind=SUPER,F,togglemaximizescreen
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER,C,centerwin
bind=SUPER,R,dwindle_toggle_current_split

# Фокус (стрелки)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Перемещение окон внутри раскладки
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down

# Группы (в Mango это join/leave + group bar, не Hyprland-группы)
bind=SUPER,G,groupjoin,left
bind=SUPER+ALT,G,groupleave
bind=SUPER+ALT,Left,groupfocus,prev
bind=SUPER+ALT,Right,groupfocus,next
bind=SUPER+ALT+SHIFT,Left,groupjoin,left
bind=SUPER+ALT+SHIFT,Right,groupjoin,right
bind=SUPER+ALT+SHIFT,Up,groupjoin,up
bind=SUPER+ALT+SHIFT,Down,groupjoin,down
# lockgroups в Mango нет — показываем/скрываем панель групп
bind=SUPER+ALT,L,togglegroupbar

# Ресайз тайлов
bind=SUPER+CTRL,Left,resizewin,-40,0
bind=SUPER+CTRL,Right,resizewin,40,0
bind=SUPER+CTRL,Up,resizewin,0,-40
bind=SUPER+CTRL,Down,resizewin,0,40

# Ресайз floating-окон по направлениям
bind=SUPER+ALT+CTRL,Left,smartresizewin,left
bind=SUPER+ALT+CTRL,Right,smartresizewin,right
bind=SUPER+ALT+CTRL,Up,smartresizewin,up
bind=SUPER+ALT+CTRL,Down,smartresizewin,down

# Перестановка окон
bind=SUPER+CTRL+SHIFT,Left,exchange_client,left
bind=SUPER+CTRL+SHIFT,Right,exchange_client,right
bind=SUPER+CTRL+SHIFT,Up,exchange_client,up
bind=SUPER+CTRL+SHIFT,Down,exchange_client,down

# Теги 1-9 (в Hyprland — воркспейсы)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# Соседние теги
bind=SUPER,Page_Up,viewtoleft
bind=SUPER,Page_Down,viewtoright
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright

# Scratchpad
bind=SUPER,S,toggle_scratchpad
bind=SUPER+SHIFT,S,tag_special_silent

# Конфиг и прокси
bind=SUPER+SHIFT,R,reload_config
bind=SUPER+SHIFT,P,spawn_shell,$HOME/.local/bin/proxy toggle

# Скриншоты
bind=CTRL+SHIFT,code:39,spawn_shell,$HOME/.local/bin/screenshot area
bind=CTRL,Print,spawn_shell,$HOME/.local/bin/screenshot full
bind=ALT,Print,spawn_shell,$HOME/.local/bin/screenshot window

# Мультимедиа
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bind=SUPER+SHIFT,A,spawn_shell,$HOME/.local/bin/audio-sink-menu

# Мышь: перетаскивание и ресайз
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# -------------------
# ---- WINDOW RULES ---
# -------------------
# Steam: список друзей — floating
window_rule=is_floating:1,app_id:^(steam)$,title:^(Friends List.*)$

# Игры: tearing без блюра
window_rule=force_tearing:1,app_id:^(cs2|steam_app_.*|horizon)$
window_rule=no_blur:1,app_id:^(cs2|steam_app_.*|horizon)$

# Kitty: обычный режим и лёгкая прозрачность
window_rule=is_fullscreen:0,app_id:^(kitty)$
window_rule=focused_opacity:0.97,unfocused_opacity:0.95,app_id:^(kitty)$

# Системные и файловые диалоги — floating по центру
window_rule=is_floating:1,app_id:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.FileRoller|hyprland-share-picker)$
window_rule=is_floating:1,app_id:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|zenity|yad)$

# PiP: маленькое окно поверх
window_rule=is_floating:1,title:^(Picture-in-Picture|Picture in picture)$
