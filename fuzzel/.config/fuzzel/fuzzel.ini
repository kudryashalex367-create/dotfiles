# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Adwaita
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.3
line-height=22
anchor=center
layer=overlay
match-counter=yes
show-actions=yes

[border]
width=2
radius=16
selection-radius=10

[colors]
background=1f0f10cc
text=fcdbdcff
prompt=ffb2b8ff
input=fcdbdcff
match=ffb2b8ff
selection=ff506fff
selection-text=000000ff
selection-match=ffb2b8ff
border=ffb2b8ff
