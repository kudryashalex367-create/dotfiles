# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Adwaita
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.3
line-height=22
anchor=center
layer=overlay
match-counter=yes
show-actions=yes

[border]
width=2
radius=16
selection-radius=10

[colors]
background=1c1014cc
text=f5dde2ff
prompt=ffb0caff
input=f5dde2ff
match=ffb0caff
selection=f5549bff
selection-text=000000ff
selection-match=ffb0caff
border=ffb0caff
