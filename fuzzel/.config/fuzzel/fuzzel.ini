# Генерируется matugen из обоев (~/.local/bin/wall-colors).
# Ручные правки перезапишутся — правь этот шаблон.

[main]
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
icon-theme=Adwaita
fields=filename,name,generic,exec,categories,keywords
terminal=kitty
lines=10
width=40
horizontal-pad=20
vertical-pad=14
inner-pad=10
image-size-ratio=0.3
line-height=22
anchor=center
layer=overlay
match-counter=yes
show-actions=yes

[border]
width=2
radius=16
selection-radius=10

[colors]
background=10131acc
text=e1e2ebff
prompt=abc7ffff
input=e1e2ebff
match=b0c7f5ff
selection=2575deff
selection-text=000000ff
selection-match=b0c7f5ff
border=abc7ffff
