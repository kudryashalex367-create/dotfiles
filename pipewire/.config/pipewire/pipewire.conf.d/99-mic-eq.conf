# PipeWire Filter-Chain: Clean Microphone
# High-Pass (80 Hz) → Peaking EQ (3500 Hz) → Soft Compressor SC4m → Lookahead Limiter (-1.5 dB)

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Clean Microphone"
            media.name       = "Clean Microphone"
            filter.graph = {
                nodes = [
                    {
                        type    = builtin
                        name    = eq_hp
                        label   = bq_highpass
                        control = { "Freq" = 80.0 "Q" = 0.707 }
                    }
                    {
                        type    = builtin
                        name    = eq_clarity
                        label   = bq_peaking
                        control = { "Freq" = 3500.0 "Q" = 0.8 "Gain" = 1.5 }
                    }
                    {
                        type    = ladspa
                        name    = compressor
                        plugin  = "sc4m_1916"
                        label   = sc4m
                        control = {
                            "RMS/peak"             = 0.0
                            "Attack time (ms)"     = 10.0
                            "Release time (ms)"    = 250.0
                            "Threshold level (dB)" = -16.0
                            "Ratio (1:n)"          = 2.0
                            "Knee radius (dB)"     = 3.0
                            "Makeup gain (dB)"     = 0.5
                        }
                    }
                    {
                        type    = ladspa
                        name    = limiter
                        plugin  = "fast_lookahead_limiter_1913"
                        label   = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)"  = 0.0
                            "Limit (dB)"       = -1.5
                            "Release time (s)" = 0.05
                        }
                    }
                ]
                links = [
                    { output = "eq_hp:Out"         input = "eq_clarity:In" }
                    { output = "eq_clarity:Out"    input = "compressor:Input" }
                    { output = "compressor:Output" input = "limiter:Input 1" }
                ]
                inputs  = [ "eq_hp:In" ]
                outputs = [ "limiter:Output 1" ]
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name        = "capture.clean_mic"
                node.description = "Clean Mic Capture"
                node.passive     = true
            }
            playback.props = {
                node.name        = "source.clean_mic"
                node.description = "Microphone (Clean Voice)"
                media.class      = "Audio/Source"
            }
        }
    }
]
