# PipeWire Low-Latency Clock Configuration (144Hz / Zen 3)
# Бюджет кадра 144 Гц = 6.94 мс.
# Квант 256 сэмплов при 48 кГц = 5.33 мс (идеальная синхронизация звука и видео без XRun).

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 96000 ]
    default.clock.quantum       = 256
    default.clock.min-quantum   = 64
    default.clock.max-quantum   = 1024
}
